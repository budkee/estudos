services:
  postgres:
    image: postgres:17
    container_name: strapi_db
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data

  strapi:
    image: node:18
    container_name: strapi_app
    working_dir: /app
    command: sh -c "npm install && npm run develop"
    volumes:
      - ./strapi:/app
    ports:
      - "1337:1337"
    depends_on:
      - postgres
    env_file:
      - .env
      

volumes:
  db_data:
