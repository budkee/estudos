# ========== PostgreSQL + PgAdmin ========== 
services:

  postgresql:

    image: postgres:latest
    container_name: 'db_postgres'
    restart: always
    environment:
      POSTGRES_PASSWORD: 'pass'
      TZ: 'America/Campo_Grande'
    ports:
      - "7777:5432"
    
  
  pgadmin:
    container_name: 'db_interface_pga'
    image: dpage/pgadmin4:8.12
    environment:
      PGADMIN_DEFAULT_EMAIL: "kae.budke@gmail.com"
      PGADMIN_DEFAULT_PASSWORD: "gatinho_estrelar"
    ports:
      - "7878:80"
    # Monta o arquivo de configuração
    # volumes:
      # - ./config.py:/pgadmin4/config.py  
    depends_on:
      - postgresql
    
    
