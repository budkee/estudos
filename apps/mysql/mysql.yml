# ========== Mysql + PMA ========== 
# Stack de serviços mysql + interface web como pma

services:
  mysql:
    image: mysql:latest
    container_name: db_mysql
    environment:
      MYSQL_ROOT_PASSWORD: sirius
      MYSQL_USER: siriusb
      MYSQL_PASSWORD: sirius
      MYSQL_DATABASE: default_schema
    ports:
      # host:container
      - 3310:3306
  
  phpmyadmin:
    image: phpmyadmin
    container_name: db_interface_pma
    # Conexão
    links:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    restart: always
    ports:
      - 8183:80
